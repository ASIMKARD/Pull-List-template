name: harness

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install harness dependencies
        run: npm ci --no-audit --no-fund

      - name: Generated files are fresh (data.js, sw.js, manifest.json)
        run: python3 tools/build.py --check

      - name: Fixtures build
        run: |
          python3 tools/build.py test/fixtures/basic/dataset.json --out "$RUNNER_TEMP/basic"
          python3 tools/build.py test/fixtures/no-periods/dataset.json --out "$RUNNER_TEMP/no-periods"

      - name: Run the harness (fails on any failure, any crash, or zero assertions)
        run: |
          set -o pipefail
          node test/run.js | tee "$RUNNER_TEMP/harness.log"

      - name: Require a non-zero assertion count
        run: |
          line=$(grep -E '^[0-9]+ assertions, [0-9]+ failed' "$RUNNER_TEMP/harness.log" | tail -1)
          echo "$line"
          count=$(echo "$line" | grep -oE '^[0-9]+')
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::The harness made zero assertions — a crashed harness looks like a pass."
            exit 1
          fi
          echo "### Harness: $line" >> "$GITHUB_STEP_SUMMARY"
